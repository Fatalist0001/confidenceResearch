# CI for the operational layer: unit tests, the state/registry check, JSON validity and
# PowerShell syntax. It does not download models, build llama.cpp or run any GPU work.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -v

      - name: Generated run registry is current
        run: python scripts/build_runs.py --check

      - name: Registry and documentation state
        run: python scripts/check_state.py

      - name: JSON files parse
        run: |
          python - <<'PY'
          import json
          for path in ("PROJECT_STATE.json", "RUNS.json", "profiles.json"):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              assert isinstance(data, dict), path
              print(f"{path}: {len(data)} top-level keys")
          PY

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("scripts/run.ps1", "scripts/bootstrap.ps1")) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($file):$($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "${file}: parse OK ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { exit 1 }

      - name: Inputs are unchanged and complete
        run: python pipeline/preflight.py --input pipeline/data/main.jsonl --expect-rows 6000 --require-instruction
